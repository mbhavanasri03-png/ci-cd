- name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Navigate to app directory or create it
            [ -d "ci-cd" ] && cd ci-cd && git pull origin main || git clone https://github.com/mbhavanasri03-png/ci-cd.git
            cd ci-cd

            # Stop and remove old container
            sudo docker stop frontend-app || true
            sudo docker rm frontend-app || true

            # Build and Run
            sudo docker build -t frontend-app .
            sudo docker run -d -p 80:80 --name frontend-app frontend-app

            # Clean up old images to save disk space
            sudo docker image prune -f
